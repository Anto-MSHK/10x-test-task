<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our online courses — Catalog</title>
  <meta name="description" content="Online courses catalog with live search and category filtering.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">

  <!-- Inline SVG favicon (avoids a 404 with no extra request) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff3f3a'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='900' fill='%23fff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="catalog">
    <!-- Decorative shapes (purely visual) -->
    <div class="decor" aria-hidden="true">
      <img class="decor__item decor__item--dots" src="assets/images/deco-dots.svg" alt="">
      <img class="decor__item decor__item--chevrons" src="assets/images/deco-shapes-2.svg" alt="">
      <img class="decor__item decor__item--shapes" src="assets/images/deco-shapes-1.svg" alt="">
    </div>

    <div class="catalog__container">
      <header class="heading catalog__heading">
        <p class="heading__overline">Enjoy your studying!</p>
        <h1 class="heading__title">Our online courses</h1>
      </header>

      <div class="controls catalog__controls">
        <!-- Category tabs are rendered by JS from the data source -->
        <ul class="tabs controls__tabs" id="tabs" role="radiogroup" aria-label="Filter courses by category"></ul>

        <form class="search controls__search" role="search" action="#" novalidate>
          <label class="search__label" for="search-input">Search course</label>
          <input
            class="search__input"
            id="search-input"
            type="search"
            name="search"
            placeholder="Search course..."
            autocomplete="off">
          <span class="search__icon" aria-hidden="true">
            <svg viewBox="0 0 14.3333 14.3333" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M6.41667 1.33333C3.60922 1.33333 1.33333 3.60922 1.33333 6.41667C1.33333 9.22411 3.60922 11.5 6.41667 11.5C7.81926 11.5 9.08811 10.9328 10.0085 10.0137C10.9307 9.09288 11.5 7.82189 11.5 6.41667C11.5 3.60922 9.22411 1.33333 6.41667 1.33333ZM0 6.41667C0 2.87284 2.87284 0 6.41667 0C9.96049 0 12.8333 2.87284 12.8333 6.41667C12.8333 7.94947 12.2952 9.35754 11.3986 10.4609L14.1376 13.1948C14.3982 13.4549 14.3986 13.877 14.1385 14.1376C13.8784 14.3982 13.4563 14.3986 13.1957 14.1385L10.4553 11.4032C9.35281 12.297 7.94689 12.8333 6.41667 12.8333C2.87284 12.8333 0 9.96049 0 6.41667Z" fill="currentColor"/>
            </svg>
          </span>
        </form>
      </div>

      <!-- Result counter — shown only while a filter or search is active -->
      <p class="catalog__count" id="count" role="status" aria-live="polite" hidden></p>

      <!-- Course cards are rendered by JS -->
      <ul class="courses catalog__courses" id="courses"></ul>

      <p class="catalog__empty" id="empty" hidden>No courses found. Try another search or category.</p>

      <div class="catalog__more">
        <!-- Hidden until JS renders the grid, so it never flashes high on the
             page and then jumps down once the cards are injected (CLS). -->
        <button class="load-more" id="load-more" type="button" hidden>
          <span class="load-more__icon" aria-hidden="true">
            <svg viewBox="0 0 21.7981 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M1 0C1.55228 0 2 0.447715 2 1V5.43632C3.65803 2.20928 7.01998 0 10.9 0C15.2556 0 18.9584 2.78413 20.3307 6.66675C20.5147 7.18747 20.2418 7.75879 19.7211 7.94284C19.2004 8.12689 18.6291 7.85396 18.445 7.33325C17.3463 4.22472 14.3817 2 10.9 2C7.93996 2 5.35365 3.60799 3.96994 6H6.99996C7.55225 6 7.99996 6.44772 7.99996 7C7.99996 7.55228 7.55225 8 6.99996 8H1C0.447715 8 0 7.55228 0 7V1C0 0.447715 0.447715 0 1 0Z" fill="currentColor"/>
              <path fill-rule="evenodd" clip-rule="evenodd" d="M2.07703 12.0572C2.59775 11.8731 3.16907 12.146 3.35312 12.6668C4.45183 15.7753 7.41647 18 10.8982 18C13.8582 18 16.4445 16.392 17.8282 14H14.7982C14.2459 14 13.7982 13.5523 13.7982 13C13.7982 12.4477 14.2459 12 14.7982 12H20.7981C21.3504 12 21.7981 12.4477 21.7981 13V19C21.7981 19.5523 21.3504 20 20.7981 20C20.2459 20 19.7981 19.5523 19.7981 19V14.5637C18.1401 17.7907 14.7782 20 10.8982 20C6.54254 20 2.83975 17.2159 1.46744 13.3332C1.28339 12.8125 1.55632 12.2412 2.07703 12.0572Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="load-more__text">Load more</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
